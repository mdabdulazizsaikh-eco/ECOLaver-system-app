name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: App icon, splash screen and fixed signing key
        run: |
          cp -r android-icons/* android/app/src/main/res/
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          find android/app/src/main/res -name 'splash.png' -exec cp assets/splash.png {} \;
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          echo "window.APP_BUILD = ${{ github.run_number }};" > docs/version.js

      - name: Add the storage-access helper (lets the app save backups in your own folder)
        run: |
          D=android/app/src/main/java/com/ecolaver/business
          ls $D
          cp native/StorageAccessPlugin.java native/MainActivity.java $D/

      - name: Copy web files into the app
        run: npx cap sync android

      - name: Force the fixed signing key
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  debug {
                      storeFile file("$rootDir/../keystore/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          EOF
          sha256sum keystore/debug.keystore

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          { echo "Keystore file sha256: $(sha256sum keystore/debug.keystore | cut -d' ' -f1)"; $APKSIGNER verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256"; } | tee cert.txt

      - name: Keep APK as a download
        uses: actions/upload-artifact@v4
        with:
          name: ECOLaver-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK in Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ECOLaver build ${{ github.run_number }}
          body_path: cert.txt
          files: android/app/build/outputs/apk/debug/app-debug.apk
